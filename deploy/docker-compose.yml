# Copied to /opt/cine-flow by deploy/setup.sh. Layout:
#   /opt/cine-flow/{docker-compose.yml, cine-flow/, movie-aggregator-api/}

# Container logs are capped (3 x 10MB each) so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: cineflow-redis
    restart: unless-stopped
    logging: *logging
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./movie-aggregator-api
    container_name: cineflow-backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - ./movie-aggregator-api/.env
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    # Unhealthy containers are restarted by the cron job installed by setup.sh
    # (Docker itself only restarts containers that exit).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./cine-flow
      args:
        VITE_MOVIE_API_URL: https://be.review-mine.com
        VITE_SITE_URL: https://review-mine.com
    container_name: cineflow-frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
