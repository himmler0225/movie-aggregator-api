# Full config (HTTPS) for nginx 1.18+ (Ubuntu 22.04). Certificates come from
# `certbot certonly --nginx`, which never edits this file, so deploys can
# overwrite it safely. Renewal challenges are injected temporarily by certbot.
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/javascript application/manifest+json image/svg+xml;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

ssl_certificate     /etc/letsencrypt/live/review-mine.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/review-mine.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:cineflow_ssl:10m;
ssl_session_timeout 1d;

# Everything on port 80 goes to https on the canonical host.
server {
  listen 80;
  listen [::]:80;
  server_name review-mine.com www.review-mine.com be.review-mine.com;

  location / {
    if ($host = be.review-mine.com) {
      return 301 https://be.review-mine.com$request_uri;
    }
    return 301 https://review-mine.com$request_uri;
  }
}

# www -> apex (one canonical URL for SEO).
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.review-mine.com;
  return 301 https://review-mine.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name review-mine.com;
  client_max_body_size 10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location / {
    include /etc/nginx/snippets/cineflow-proxy.conf;
    proxy_pass http://127.0.0.1:3000;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name be.review-mine.com;
  client_max_body_size 10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    include /etc/nginx/snippets/cineflow-proxy.conf;
    # socket.io (watch party)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:3001;
  }
}
